[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
skip = ["*Governance/Governor*"]
remappings = [
  "@openzeppelin/=lib/openzeppelin-contracts/",
  "@archliquid/core/=lib/core/src/",
  "@archliquid/lockers/=lib/lockers/src/",
  "@archliquid/token/=lib/token/src/",
  "@archliquid/launchpad/=lib/launchpad/src/",
  "@archliquid/vesting/=lib/vesting/src/",
  "@archliquid/staking/=lib/staking/src/",
  "@archliquid/lending/=lib/lending/src/lending/",
  "compound/=lib/lending/lib/compound-protocol/contracts/",
]

[rpc_endpoints]
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"
robinhood_mainnet = "https://rpc.mainnet.chain.robinhood.com"

[etherscan]
robinhood_testnet = { key = "${BLOCKSCOUT_API_KEY}", url = "https://explorer.testnet.chain.robinhood.com/api", chain = 46630 }
